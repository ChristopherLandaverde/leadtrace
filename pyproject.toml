[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leadtrace"
version = "0.1.0"
description = "Synthetic lead generator, automated ingestion tester, and CRM parity daemon for B2B RevOps. AI-agent ready (MCP)."
readme = "README.md"
authors = [{ name = "Christopher Landaverde", email = "chris@focosys.io" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
leadtrace = "leadtrace.cli:main"

[tool.setuptools]
packages = ["leadtrace"]
