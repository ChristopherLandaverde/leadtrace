<!doctype html><html><body>
<form method="post" action="/submit">
  <label>Email <input name="email" type="email"></label>
  <label>First <input name="firstname"></label>
  <label>Last <input name="lastname"></label>
  <label>Phone <input name="phone"></label>
  <label>Company <input name="company"></label>
  <input type="hidden" name="utm_source"><input type="hidden" name="utm_medium">
  <input type="hidden" name="utm_campaign"><input type="hidden" name="gclid">
  <input type="hidden" name="fbclid"><input type="hidden" name="original_conversion_id">
  <button type="submit">Send</button>
</form>
<script src="/populate.js"></script>
<script>
// Click tracking that POSTs before the real form submit.
document.querySelector("button").addEventListener("click", function () {
  navigator.sendBeacon("/beacon", "a=1");
  fetch("/beacon", {method: "POST", body: "event=click", keepalive: true});
});
// Deferred script that strips gclid from the address bar after load.
if (location.search.indexOf("strip=1") !== -1) {
  setTimeout(function () {
    var p = new URLSearchParams(location.search); p.delete("gclid");
    history.replaceState(null, "", location.pathname + "?" + p);
  }, 300);
}
</script></body></html>
